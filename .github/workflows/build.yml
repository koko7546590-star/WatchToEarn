name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: |
          flutter pub get
          flutter pub add firebase_core firebase_auth google_mobile_ads

      - name: Force Fix Gradle & AGP Version
        run: |
          # settings.gradle ထဲက AGP version ကို 8.3.0 သို့ အတိအကျ ပြောင်းမည်
          sed -i 's/id "com.android.application" version ".*" apply false/id "com.android.application" version "8.3.0" apply false/g' android/settings.gradle || true
          
          # build.gradle ထဲမှာ compileSdk နဲ့ targetSdk ကို 34 သို့ သတ်မှတ်မည်
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/compileSdk .*/compileSdk 34/g' android/app/build.gradle || true
            sed -i 's/targetSdkVersion .*/targetSdkVersion 34/g' android/app/build.gradle || true
          fi
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/compileSdk = .*/compileSdk = 34/g' android/app/build.gradle.kts || true
            sed -i 's/targetSdk = .*/targetSdk = 34/g' android/app/build.gradle.kts || true
          fi

      - name: Create google-services.json
        run: |
          cat << 'EOF' > android/app/google-services.json
          {
            "project_info": {
              "project_number": "989405877276",
              "project_id": "watch-to-money",
              "storage_bucket": "watch-to-money.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:989405877276:android:bf8464f9991c9cf5563bd9",
                  "android_client_info": {
                    "package_name": "com.watchtomoney.app"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AiZaSyDr16pEElu7sXwrkEiC9y0Zug_G0hmIPpg"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Update AndroidManifest for AdMob & Firebase
        run: |
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <application
                  android:label="Watch &amp; Earn"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">
                  
                  <meta-data
                      android:name="com.google.android.gms.ads.APPLICATION_ID"
                      android:value="ca-app-pub-3940256099942544~3347511713"/>

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:taskAffinity=""
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

      - name: Inject Custom Code into main.dart
        run: |
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:firebase_core/firebase_core.dart';
          import 'package:firebase_auth/firebase_auth.dart';
          import 'package:google_mobile_ads/google_mobile_ads.dart';

          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await Firebase.initializeApp();
            MobileAds.instance.initialize();
            runApp(const WatchToEarnApp());
          }

          class WatchToEarnApp extends StatelessWidget {
            const WatchToEarnApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Watch & Earn Myanmar',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(primarySwatch: Colors.indigo, useMaterial3: true),
                home: const PhoneAuthScreen(),
              );
            }
          }

          class PhoneAuthScreen extends StatefulWidget {
            const PhoneAuthScreen({super.key});

            @override
            State<PhoneAuthScreen> createState() => _PhoneAuthScreenState();
          }

          class _PhoneAuthScreenState extends State<PhoneAuthScreen> {
            final TextEditingController _phoneController = TextEditingController();
            final TextEditingController _otpController = TextEditingController();
            final FirebaseAuth _auth = FirebaseAuth.instance;

            bool _isOtpSent = false;
            bool _isLoading = false;
            String? _verificationId;
            final String _adminPhoneNumber = '09682396685';

            void _sendOtp() async {
              String rawPhone = _phoneController.text.trim();
              if (rawPhone.isEmpty) {
                _showSnackBar('ဖုန်းနံပါတ် ရိုက်ထည့်ပါ');
                return;
              }

              String formattedPhone = rawPhone.startsWith('09')
                  ? rawPhone.replaceFirst('09', '+959')
                  : (rawPhone.startsWith('+959') ? rawPhone : '+959$rawPhone');

              setState(() => _isLoading = true);

              try {
                await _auth.verifyPhoneNumber(
                  phoneNumber: formattedPhone,
                  timeout: const Duration(seconds: 60),
                  verificationCompleted: (PhoneAuthCredential credential) async {
                    await _auth.signInWithCredential(credential);
                    _verifyAndLogin(rawPhone);
                  },
                  verificationFailed: (FirebaseAuthException e) {
                    setState(() => _isLoading = false);
                    _showSnackBar('OTP ပို့၍ မရပါ: ${e.message}');
                  },
                  codeSent: (String verificationId, int? resendToken) {
                    setState(() {
                      _isLoading = false;
                      _isOtpSent = true;
                      _verificationId = verificationId;
                    });
                    _showSnackBar('SMS ထဲသို့ OTP Code ပို့လိုက်ပါပြီ');
                  },
                  codeAutoRetrievalTimeout: (String verificationId) {
                    _verificationId = verificationId;
                  },
                );
              } catch (e) {
                setState(() => _isLoading = false);
                _showSnackBar('အမှားအယွင်း ဖြစ်ပေါ်ခဲ့သည်: $e');
              }
            }

            void _verifyOtp() async {
              String smsCode = _otpController.text.trim();
              if (smsCode.length < 6 || _verificationId == null) {
                _showSnackBar('ဂဏန်း ၆ လုံးပါသော OTP ရိုက်ထည့်ပါ');
                return;
              }

              setState(() => _isLoading = true);

              try {
                PhoneAuthCredential credential = PhoneAuthProvider.credential(
                  verificationId: _verificationId!,
                  smsCode: smsCode,
                );

                await _auth.signInWithCredential(credential);
                String rawPhone = _phoneController.text.trim();
                _verifyAndLogin(rawPhone);
              } catch (e) {
                setState(() => _isLoading = false);
                _showSnackBar('OTP မှားယွင်းနေပါသည်');
              }
            }

            void _verifyAndLogin(String phone) {
              String cleanPhone = phone.startsWith('+959') ? phone.replaceFirst('+959', '09') : (phone.startsWith('09') ? phone : '09$phone');
              
              if (cleanPhone == _adminPhoneNumber) {
                Navigator.pushReplacement(context, MaterialPageRoute(builder: (context) => AdminScreen(phoneNumber: cleanPhone)));
              } else {
                Navigator.pushReplacement(context, MaterialPageRoute(builder: (context) => HomeScreen(phoneNumber: cleanPhone)));
              }
            }

            void _showSnackBar(String text) {
              ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text(text)));
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: Padding(
                  padding: const EdgeInsets.all(24.0),
                  child: Column(
                    mainAxisAlignment: MainAxisAlignment.center,
                    crossAxisAlignment: CrossAxisAlignment.stretch,
                    children: [
                      const Icon(Icons.security, size: 80, color: Colors.indigo),
                      const SizedBox(height: 16),
                      const Text('Phone Verification', textAlign: TextAlign.center, style: TextStyle(fontSize: 24, fontWeight: FontWeight.bold)),
                      const SizedBox(height: 32),
                      TextField(
                        controller: _phoneController,
                        keyboardType: TextInputType.phone,
                        enabled: !_isOtpSent,
                        decoration: const InputDecoration(labelText: 'ဖုန်းနံပါတ် ထည့်ပါ', prefixText: '09 ', border: OutlineInputBorder()),
                      ),
                      const SizedBox(height: 16),
                      if (_isOtpSent)
                        TextField(
                          controller: _otpController,
                          keyboardType: TextInputType.number,
                          textAlign: TextAlign.center,
                          style: const TextStyle(fontSize: 24, letterSpacing: 8),
                          decoration: const InputDecoration(labelText: 'SMS Code ထည့်ပါ', border: OutlineInputBorder()),
                        ),
                      const SizedBox(height: 20),
                      ElevatedButton(
                        onPressed: _isLoading ? null : (_isOtpSent ? _verifyOtp : _sendOtp),
                        style: ElevatedButton.styleFrom(padding: const EdgeInsets.symmetric(vertical: 16), backgroundColor: Colors.indigo, foregroundColor: Colors.white),
                        child: _isLoading ? const CircularProgressIndicator(color: Colors.white) : Text(_isOtpSent ? 'OTP အတည်ပြုမည်' : 'OTP Code တောင်းမည်'),
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          class HomeScreen extends StatefulWidget {
            final String phoneNumber;
            const HomeScreen({super.key, required this.phoneNumber});

            @override
            State<HomeScreen> createState() => _HomeScreenState();
          }

          class _HomeScreenState extends State<HomeScreen> {
            int _userPoints = 5000;
            bool _isProcessingAd = false;
            bool _isProcessingWithdraw = false;
            RewardedAd? _rewardedAd;

            final String _adUnitId = 'ca-app-pub-3940256099942544/5224354917';

            @override
            void initState() {
              super.initState();
              _loadRewardedAd();
            }

            void _loadRewardedAd() {
              RewardedAd.load(
                adUnitId: _adUnitId,
                request: const AdRequest(),
                rewardedAdLoadCallback: RewardedAdLoadCallback(
                  onAdLoaded: (ad) {
                    _rewardedAd = ad;
                  },
                  onAdFailedToLoad: (error) {
                    _rewardedAd = null;
                  },
                ),
              );
            }

            void _watchAd() {
              if (_rewardedAd != null) {
                setState(() => _isProcessingAd = true);
                _rewardedAd!.show(
                  onUserEarnedReward: (AdWithoutView ad, RewardItem reward) {
                    setState(() {
                      _userPoints += 50;
                    });
                    ScaffoldMessenger.of(context).showSnackBar(
                      const SnackBar(content: Text('ကြော်ငြာကြည့်ပြီးပါပြီ! +50 Points ရရှိပါသည်')),
                    );
                  },
                );
                _rewardedAd = null;
                _loadRewardedAd();
                setState(() => _isProcessingAd = false);
              } else {
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(content: Text('ကြော်ငြာ Load လုပ်နေဆဲဖြစ်သည်၊ ခဏစောင့်ပြီး ပြန်နှိပ်ပါ')),
                );
                _loadRewardedAd();
              }
            }

            void _autoWithdraw() async {
              if (_userPoints < 1000) {
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(content: Text('အနည်းဆုံး 1000 Points ရှိမှ ငွေထုတ်နိုင်ပါမည်')),
                );
                return;
              }

              setState(() => _isProcessingWithdraw = true);
              await Future.delayed(const Duration(seconds: 3));

              setState(() {
                _isProcessingWithdraw = false;
                _userPoints -= 1000;
              });

              if (mounted) {
                showDialog(
                  context: context,
                  builder: (context) => AlertDialog(
                    title: const Row(
                      children: [
                        Icon(Icons.check_circle, color: Colors.green),
                        SizedBox(width: 8),
                        Text('Auto Withdraw Success'),
                      ],
                    ),
                    content: Text('1000 MMK ကို အကောင့်နံပါတ် ${widget.phoneNumber} သို့ အလိုအလျောက် လွှဲပြောင်းပေးပြီးပါပြီ။'),
                    actions: [
                      TextButton(onPressed: () => Navigator.pop(context), child: const Text('OK')),
                    ],
                  ),
                );
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('Watch & Earn'), backgroundColor: Colors.indigo, foregroundColor: Colors.white),
                body: Padding(
                  padding: const EdgeInsets.all(20.0),
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.stretch,
                    children: [
                      Card(
                        color: Colors.indigo.shade50,
                        child: Padding(
                          padding: const EdgeInsets.all(20.0),
                          child: Column(
                            children: [
                              Text('အသုံးပြုသူ: ${widget.phoneNumber}', style: const TextStyle(fontSize: 16)),
                              const SizedBox(height: 8),
                              Text('$_userPoints Points', style: const TextStyle(fontSize: 32, fontWeight: FontWeight.bold, color: Colors.indigo)),
                              Text('လက်ကျန်ငွေ: $_userPoints MMK', style: const TextStyle(color: Colors.green, fontWeight: FontWeight.bold)),
                            ],
                          ),
                        ),
                      ),
                      const SizedBox(height: 20),
                      ElevatedButton.icon(
                        onPressed: _isProcessingAd ? null : _watchAd,
                        icon: const Icon(Icons.play_circle_fill),
                        label: Text(_isProcessingAd ? 'ကြော်ငြာကြည့်နေသည်...' : 'ကြော်ငြာကြည့်မည် (+50 Points)'),
                        style: ElevatedButton.styleFrom(backgroundColor: Colors.indigo, foregroundColor: Colors.white, padding: const EdgeInsets.all(16)),
                      ),
                      const SizedBox(height: 12),
                      ElevatedButton.icon(
                        onPressed: _isProcessingWithdraw ? null : _autoWithdraw,
                        icon: const Icon(Icons.account_balance_wallet),
                        label: Text(_isProcessingWithdraw ? 'Auto Transfer ပြုလုပ်နေသည်...' : 'Auto Withdraw (1000 MMK ထုတ်မည်)'),
                        style: ElevatedButton.styleFrom(backgroundColor: Colors.green, foregroundColor: Colors.white, padding: const EdgeInsets.all(16)),
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          class AdminScreen extends StatelessWidget {
            final String phoneNumber;
            const AdminScreen({super.key, required this.phoneNumber});

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('Admin Panel'), backgroundColor: Colors.redAccent, foregroundColor: Colors.white),
                body: Center(child: Text('Admin Login Success: $phoneNumber', style: const TextStyle(fontSize: 18))),
              );
            }
          }
          EOF

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
